[workspace]
members = [
  "crates/wisp-protocol",
  "apps/wispd",
  "apps/wisp-server",
  "apps/wispctl",
  "tools/wisp-sim",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ashpd = { version = "0.13", default-features = false, features = ["screencast", "tokio"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
futures-util = "0.3"
gstreamer = { version = "0.24", features = ["v1_22"] }
gstreamer-app = { version = "0.24", features = ["v1_22"] }
gstreamer-video = { version = "0.24", features = ["v1_22"] }
hound = "3.5"
hmac = "0.12"
ksni = "0.3"
libc = "0.2"
livekit = { version = "=0.8.4", features = ["rustls-tls-native-roots"] }
nnnoiseless = { version = "0.5", default-features = false }
ndarray = "0.15"
pollster = "=1.0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["gles", "std", "vulkan", "wgsl"] }
winit = { version = "=0.30.12", default-features = false, features = ["rwh_06", "wayland", "wayland-csd-adwaita", "wayland-dlopen", "x11"] }
wisp-protocol = { path = "crates/wisp-protocol" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
