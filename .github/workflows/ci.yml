name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CC: clang-21
  CXX: clang++-21

jobs:
  build:
    name: Build and test Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native build dependencies
        run: |
          llvm_key="$RUNNER_TEMP/llvm-snapshot.gpg.key"
          llvm_keyring="$RUNNER_TEMP/llvm-archive-keyring.gpg"
          curl --fail --location --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$llvm_key"
          llvm_fingerprint=$(gpg --show-keys --with-colons "$llvm_key" \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$llvm_fingerprint" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          gpg --dearmor --output "$llvm_keyring" "$llvm_key"
          sudo install -m 0644 "$llvm_keyring" /usr/share/keyrings/llvm-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-21 \
            cmake \
            jq \
            libasound2-dev \
            libdbus-1-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-good \
            libpipewire-0.3-dev \
            libpulse-dev \
            libssl-dev \
            libwayland-dev \
            libxkbcommon-dev \
            ninja-build \
            pulseaudio \
            pulseaudio-utils \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            ripgrep \
            sqlite3

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt

      - name: Cache Rust downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: cargo-linux-x86_64-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-x86_64-1.97.0-

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --locked

      - name: Run headless integration tests
        run: |
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink \
            sink_name=wisp_test \
            sink_properties=device.description=Wisp_Test >/dev/null
          pactl set-default-sink wisp_test
          pactl set-default-source wisp_test.monitor
          ./scripts/test-integration.sh
          ./scripts/test-knock.sh
          ./scripts/test-media.sh
          ./scripts/test-private-alpha.sh

      - name: Scan tracked source for secrets
        run: ./scripts/scan-secrets.sh

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Package Linux release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            package_version=$GITHUB_REF_NAME
          else
            package_version=${GITHUB_SHA:0:12}
          fi
          ./scripts/package-release.sh "$package_version"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wisp-linux-x86_64
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WISP_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$WISP_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$WISP_RELEASE_TAG" dist/* --clobber
          else
            gh release create "$WISP_RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Wisp $WISP_RELEASE_TAG"
          fi
