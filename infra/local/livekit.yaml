port: 7880
# Loopback-only development configuration. Public hosts use independent random
# credentials and the hardened template under infra/private-host.
bind_addresses:
  - "127.0.0.1"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
keys:
  devkey: wisp-local-development-secret-32
logging:
  level: info
