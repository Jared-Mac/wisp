[package]
name = "wisp-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
# aes-gcm's own flag does not enable its backend cleanup features.
aes = { version = "0.8.4", features = ["zeroize"] }
ghash = { version = "0.5.1", features = ["zeroize"] }
polyval = { version = "0.6.2", features = ["zeroize"] }
argon2.workspace = true
hkdf = "0.12.4"
url.workspace = true
chrono.workspace = true
wisp-protocol = { path = "../wisp-protocol" }
age = { version = "0.11.3", default-features = false }
anyhow.workspace = true
base64.workspace = true
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
getrandom = "0.2"
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize = { version = "1.8", features = ["derive"] }
uuid.workspace = true
tempfile = "3"
opaque-ke = { version = "=4.0.1", features = ["argon2"] }
rand = "0.8"


[lints]
workspace = true
